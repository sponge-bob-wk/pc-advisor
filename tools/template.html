<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="用公开数据看清最近电脑价格上涨了多少，哪台最值，以及现在该不该买。离线可用，不登录。">
<title>最近电脑涨价了吗</title>
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --ink:#1c1c1a; --ink2:#5f5e5a; --ink3:#8f8d86;
  --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.17);
  --up:#bf392b; --upbg:#fdeeec; --upink:#9c2d21;
  --down:#17795e; --downbg:#e8f6f0;
  --amber:#8a5a0b; --amberbg:#fdf4e3;
  --blue:#1a5f9e; --bluebg:#eaf2fa;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.66;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:26px 18px 72px}
/* ---------- home ---------- */
.kicker{font-size:12.5px;letter-spacing:.08em;color:var(--ink3);margin:0 0 10px}
h1{font-size:29px;line-height:1.28;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
.lede{margin:0 0 26px;color:var(--ink2);font-size:15px}
.ask{
  display:flex;gap:6px;align-items:center;background:var(--card);
  border:1px solid var(--line2);border-radius:16px;padding:5px 5px 5px 15px;
  transition:box-shadow .15s,border-color .15s;
}
.ask:focus-within{border-color:#b9b6ae;box-shadow:0 0 0 4px rgba(0,0,0,.045)}
.ask input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:16px;color:var(--ink);padding:10px 0;font-family:inherit;
}
.ask input::placeholder{color:#b3b0a8}
.ask button{
  flex:none;border:0;background:var(--ink);color:#fff;font-size:14.5px;font-weight:500;
  font-family:inherit;padding:11px 17px;border-radius:12px;cursor:pointer;
}
.ask button:active{opacity:.82}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:7px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;
  font-family:inherit;line-height:1.4;
}
.chip:active{background:#f0efeb}
.meta{font-size:12.5px;color:var(--ink3);margin:22px 0 0;line-height:1.75}
.saved{
  background:var(--bluebg);border-left:3px solid var(--blue);border-radius:10px;
  padding:11px 13px;font-size:13.5px;color:#164e80;margin:0 0 20px;cursor:pointer;
}
.saved b{font-weight:500}
/* ---------- result ---------- */
.back{font-size:13.5px;color:var(--ink2);cursor:pointer;margin:0 0 16px;display:inline-block}
.back:active{opacity:.6}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px 20px}
.pill{
  display:inline-block;font-size:12.5px;font-weight:500;padding:4px 11px;
  border-radius:999px;line-height:1.4;
}
.t-stop{background:var(--upbg);color:var(--upink)}
.t-mixed{background:var(--amberbg);color:var(--amber)}
.t-think{background:var(--bluebg);color:var(--blue)}
.t-now{background:var(--downbg);color:var(--down)}
.vhead{font-size:20.5px;line-height:1.5;font-weight:600;margin:14px 0 0;letter-spacing:-.005em}
.vsub{font-size:13px;color:var(--ink3);margin:10px 0 0}
.quote{
  border-left:2px solid var(--line2);padding:2px 0 2px 13px;
  font-size:14.5px;color:var(--ink2);margin:20px 0 0;
}
.blk{margin-top:34px}
.blk h2{font-size:16.5px;font-weight:600;margin:0 0 6px;letter-spacing:-.005em}
.blk .cap{font-size:13px;color:var(--ink3);margin:0 0 16px;line-height:1.65}
/* bars */
.row{padding:9px 0}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.row .lab{font-size:13.5px;line-height:1.45}
.row .val{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.row.dim .lab,.row.dim .val{color:var(--ink3)}
.track{height:9px;background:#eeede8;border-radius:5px;overflow:hidden;display:flex}
.fill{height:100%;border-radius:5px;background:var(--up)}
.fill.soft{background:#f0a49b;border-radius:0 5px 5px 0}
.fill.gray{background:#c9c6be}
.downrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0 2px;border-top:1px solid var(--line);margin-top:8px;font-size:13.5px;
}
.downrow .dv{color:var(--down);font-variant-numeric:tabular-nums;white-space:nowrap}
/* quarter chart */
.qchart{display:flex;align-items:flex-end;gap:9px;height:198px;margin:6px 0 0}
.qcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.qval{font-size:12px;color:var(--ink2);margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qbar{width:100%;max-width:46px;border-radius:6px 6px 3px 3px;background:var(--up)}
.qcol.fc .qbar{background:#f7d9d3;border:1px dashed #c98276;border-radius:6px 6px 3px 3px}
.qlab{font-size:12px;color:var(--ink3);margin-top:9px;white-space:nowrap}
.qcol.fc .qlab{color:var(--amber)}
/* same model */
.mrow{
  display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.mrow:last-child{border-bottom:0}
.mrow .mn{grid-column:1;grid-row:1;font-size:13.8px;line-height:1.45}
.mrow .mp{grid-column:1;grid-row:2;font-size:12.8px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:3px}
.mrow .md{grid-column:2;grid-row:1 / span 2;font-size:14px;color:var(--upink);font-variant-numeric:tabular-nums;white-space:nowrap}
/* reasons + action */
.olist{margin:0;padding:0;list-style:none}
.olist li{position:relative;padding:0 0 14px 18px;font-size:14.2px;color:var(--ink);line-height:1.68}
.olist li::before{
  content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:#c9c6be;
}
.actcard{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 17px;margin-top:6px;
}
.actcard .al{font-size:12.5px;color:var(--ink3);margin:0 0 7px;letter-spacing:.04em}
.actcard p{margin:0;font-size:14.2px;line-height:1.7}
/* decision */
.dlist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:6px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .dl{font-size:14px}
.drow.now .dl{font-weight:500}
/* save */
.savebtn{
  width:100%;margin-top:30px;padding:14px;border-radius:13px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;
}
.savebtn:active{background:#f0efeb}
.savebtn.done{background:var(--downbg);border-color:#b7ddd0;color:var(--down)}
.note{font-size:13.3px;border-radius:10px;padding:11px 13px;margin-top:11px;line-height:1.6}
.note.bad{background:var(--upbg);color:var(--upink)}
.srcin{font-size:12.3px;color:var(--ink3);margin:14px 0 0;line-height:1.7}
.srcin a{color:var(--ink2)}
/* ---------- 排序 / 榜单 ---------- */
.weigh{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}
.wbtn{
  border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:13px;color:var(--ink2);cursor:pointer;
  font-family:inherit;line-height:1.4;transition:all .12s;
}
.wbtn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.wbtn:active{opacity:.8}
.wcap{font-size:12.5px;color:var(--ink3);margin:0 0 10px;line-height:1.6}
/* 榜单表头：说明那个大数字是什么，否则读者分不清是跑分还是加权分 */
.colhead{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:11px;
  padding:0 16px 6px;font-size:11.5px;color:var(--ink3);
}
.colhead .ch-l{grid-column:1}
.colhead .ch-m{grid-column:2}
.colhead .ch-r{grid-column:3;text-align:right;white-space:nowrap}
.rank{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.rk{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;
  column-gap:11px;row-gap:2px;align-items:start;
  padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;
}
.rk:last-child{border-bottom:0}
.rk:active{background:#faf9f6}
.rk.top{background:#fdfaf7}
.rk .num{
  grid-column:1;grid-row:1 / span 3;font-size:13px;color:var(--ink3);
  font-variant-numeric:tabular-nums;padding-top:1px;
}
.rk.top .num{color:var(--upink);font-weight:600}
.rk .nm{grid-column:2;grid-row:1;font-size:14.5px;font-weight:500;line-height:1.45;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.rk .sp{grid-column:2;grid-row:2;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rk .sc{
  grid-column:3;grid-row:1;font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
/* 单位（mAh / 分）用小字挂在数字后面，避免「6800」被当成分数 */
.rk .sc em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:2px}
/* 档位类维度（可加装 / 便携）显示的是文字，字号要收一点，不然比机型名还抢眼 */
.rk .sc.txt{font-size:13px;font-weight:500;color:var(--ink2)}
.rk .pr{grid-column:3;grid-row:2;font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk .why{
  /* 跨到 auto 列会被 span 元素的 min-content 撑开那一列，导致右侧差几像素溢出。
     直接跨满整行（1/-1）再靠 padding 对齐到内容列起点，就没有这个风险。 */
  grid-column:1 / -1;grid-row:3;font-size:12.8px;color:var(--ink2);
  line-height:1.6;margin-top:5px;padding-left:37px;
  min-width:0;word-break:break-word;overflow-wrap:anywhere;
}
.rk .why b{font-weight:500;color:var(--ink)}
.badge{
  display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;
  margin-left:6px;vertical-align:1px;font-weight:500;
}
.b-tag{background:var(--upbg);color:var(--upink)}
/* 维度条 */
.dims{display:flex;gap:3px;margin-top:6px;grid-column:1 / -1;grid-row:4;padding-left:37px;min-width:0}
.dm{flex:1;height:4px;background:#eeede8;border-radius:2px;overflow:hidden}
.dm i{display:block;height:100%;background:#a8a49a;border-radius:2px}
.dm i.hi{background:var(--ink2)}
/* 榜单里的优缺点速览 */
.pq{margin-top:7px;grid-column:1 / -1;grid-row:5;padding-left:37px;display:flex;flex-direction:column;gap:3px;font-size:12.3px;line-height:1.55;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.pq .qg{color:var(--down)}
.pq .qb{color:var(--upink)}
.rk .num{grid-row:1 / span 4}
/* 品牌表 */
.bt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 16px;margin-top:6px}
.brow{padding:14px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
.brow .bn{font-size:14.5px;font-weight:500}
.brow .bv{font-size:12.5px;white-space:nowrap}
.brow .bw{font-size:12.8px;color:var(--ink2);line-height:1.6}
.brow .bx{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:5px}
.upgood{background:var(--downbg);color:var(--down)}
.upmixed{background:var(--amberbg);color:var(--amber)}
.upbad{background:var(--upbg);color:var(--upink)}
/* 陷阱 */
.trap{background:var(--card);border:1px solid var(--line);border-left:3px solid #d9a441;border-radius:12px;padding:13px 15px;margin-bottom:10px}
.trap .tt{font-size:14px;font-weight:500;margin:0 0 4px}
.trap p{margin:0;font-size:13.3px;color:var(--ink2);line-height:1.65}
/* 详情页 */
.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;margin:16px 0 0}
.spec dt{color:var(--ink3);white-space:nowrap}
.spec dd{margin:0;font-variant-numeric:tabular-nums}
/* 括号里的补充说明要弱化，否则和主数字一样重会抢读 */
.spec .ddim{color:var(--ink3);font-size:12px}
/* 折叠区：把次要内容收起来，首屏只留结论和榜单 */
details.fold{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-top:12px;overflow:hidden;
}
details.fold > summary{
  list-style:none;cursor:pointer;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary .ft{font-size:14.5px;font-weight:500}
details.fold > summary .fs{font-size:12.5px;color:var(--ink3);margin-top:2px}
details.fold > summary .fi{
  flex:none;font-size:12px;color:var(--ink3);transition:transform .18s;
}
details.fold[open] > summary .fi{transform:rotate(90deg)}
details.fold > .fbody{padding:0 16px 6px}
details.fold > .fbody .blk{margin-top:22px}
details.fold > .fbody .blk:first-child{margin-top:4px}
.foldwrap{margin-top:34px}
.foldwrap > h2{font-size:16.5px;font-weight:600;margin:0 0 6px}
.foldwrap > .cap{font-size:13px;color:var(--ink3);margin:0 0 4px;line-height:1.65}
/* ---------- 优缺点 ---------- */
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 16px;margin-top:12px}
.pc .prow{padding:13px 0;border-bottom:1px solid var(--line)}
.pc .prow:last-child{border-bottom:0}
.pc .ph{font-size:12.5px;letter-spacing:.06em;margin:0 0 8px}
.pc .ph.g{color:var(--down)}
.pc .ph.b{color:var(--upink)}
.pc ul{margin:0;padding:0;list-style:none}
.pc li{position:relative;padding:0 0 7px 15px;font-size:13.3px;line-height:1.6;color:var(--ink)}
.pc li:last-child{padding-bottom:0}
.pc li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:#c9c6be}
.pc.con li::before{background:#e0b3ab}
/* 详情页里的优缺点 */
.problock{margin-top:16px}
.problock .ph{font-size:12.5px;letter-spacing:.06em;margin:0 0 8px}
.problock .ph.g{color:var(--down)}
.problock .ph.b{color:var(--upink)}
.problock ul{margin:0 0 14px;padding:0;list-style:none}
.problock li{position:relative;padding:0 0 8px 16px;font-size:13.5px;line-height:1.65}
.problock li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:#b7ddd0}
.problock.cons li::before{background:#e6b3aa}
/* ---------- 国补 ---------- */
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.subcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 15px 14px}
.subcard .sh{font-size:14px;font-weight:500;margin:0 0 3px}
.subcard .sb{font-size:11.8px;color:var(--ink3);margin:0 0 11px}
.subcard .sr{display:flex;justify-content:space-between;gap:8px;font-size:12.8px;padding:4px 0;color:var(--ink2)}
.subcard .sr b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.subcard .sn{font-size:11.5px;color:var(--ink3);margin:9px 0 0;line-height:1.55}
.subcard.hot{border-color:#d9c9a8;background:#fffdf7}
.calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.calc .cl{font-size:12.5px;color:var(--ink3);margin:0 0 9px}
.calcrow{display:flex;gap:8px;align-items:center}
.calcrow input{
  flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;background:#fbfaf8;
  font-size:16px;font-family:inherit;color:var(--ink);padding:10px 12px;outline:0;
  -webkit-appearance:none;font-variant-numeric:tabular-nums;
}
.calcrow input:focus{border-color:#b9b6ae;background:#fff}
.calcrow .unit{font-size:14px;color:var(--ink3)}
.calcres{margin-top:12px;font-size:13.5px;line-height:1.75}
.calcres .big{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.calcres .big.save{color:var(--down)}
.calcres .big.none{color:var(--upink)}
.calcres .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);color:var(--ink2)}
.calcres .ln b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.calcwarn{margin-top:10px;font-size:12.8px;padding:9px 11px;border-radius:9px;line-height:1.6}
.calcwarn.bad{background:var(--upbg);color:var(--upink)}
.calcwarn.tip{background:var(--downbg);color:var(--down)}
/* 缺陷表 */
.df{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 16px;margin-top:12px}
.dfi{padding:15px 0;border-bottom:1px solid var(--line)}
.dfi:last-child{border-bottom:0}
.dfi .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.dfi .dn{font-size:14.5px;font-weight:500;line-height:1.45}
.dfi .dl{font-size:12.5px;color:var(--ink2);line-height:1.65;margin:5px 0 0}
.dfi .dl b{font-weight:500;color:var(--ink)}
.dfi .dw{font-size:12.3px;color:var(--ink3);line-height:1.6;margin:7px 0 0;padding-top:7px;border-top:1px dashed var(--line)}
/* footer */
.foot{margin-top:52px;border-top:1px solid var(--line);padding-top:20px}
.foot p{margin:0 0 12px;font-size:12.8px;color:var(--ink3);line-height:1.75}
details{font-size:13px;color:var(--ink2)}
summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0}
#srclist{margin:12px 0 0;padding-left:20px;font-size:12.5px;line-height:1.8;color:var(--ink2)}
#srclist li{margin-bottom:11px}
#srclist a{color:var(--blue);text-decoration:none;word-break:break-all}
#srclist .pm{color:var(--ink3)}
.cand{margin-top:4px}
.cand button{
  display:block;width:100%;text-align:left;margin-top:9px;padding:13px 15px;
  border:1px solid var(--line2);background:var(--card);border-radius:12px;
  font-size:14.5px;font-family:inherit;color:var(--ink);cursor:pointer;
}
.cand button:active{background:#f0efeb}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .28s ease-out both}
  @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main class="wrap">
  <section id="home">
    <p class="kicker">三分钟看清，不用注册</p>
    <h1>最近电脑和手机涨价了吗</h1>
    <p class="lede">同款机器贵了多少、<b>按你的侧重该买哪台</b>、优缺点和设计缺陷在哪，还有国补到底能省多少。</p>

    <div id="saved" class="saved" hidden></div>

    <div class="ask">
      <input id="q" type="text" autofocus autocomplete="off" placeholder="例：5000 的轻薄本 / 3000 的手机">
      <button id="go" type="button">看趋势</button>
    </div>

    <div class="chips" id="chips"></div>

    <p class="meta">数据截至 <span id="asof"></span> · 逐条标注来源 · 断网可用 · 结果只存本机</p>
  </section>

  <section id="result" hidden></section>

  <footer class="foot">
    <p>不卖货、不带推广链接、不猜价格。所有数字来自公开报道，口径冲突时给区间而不是取一个好看的值。</p>
    <details>
      <summary>数据来源（<span id="srccount"></span> 条）</summary>
      <ol id="srclist"></ol>
    </details>
  </footer>
</main>

<script>
const DATA = /*__DATA__*/;

const $ = s => document.querySelector(s);
const KEY = 'pcmove.v1';
const fmt = n => n.toLocaleString('zh-CN');
const signed = n => (n > 0 ? '+' : '') + n + '%';
const SRC = {}; DATA.sources.forEach(s => SRC[s.id] = s);
const TONE = { stop: '建议别买', mixed: '看情况', think: '换个买法', now: '刚需就买' };
const UPWORD = { good: '留插槽', mixed: '看型号', bad: '焊死' };
// upgrade 是 0-3 的档位，详情页要说人话，不能直接印数字
const OUPWORD_RAW = ['焊死', '看具体 SKU', '留插槽'];
const PORTWORD = ['不适合携带', '较重', '正常', '很轻'];

/* 维度与权重按品类分开：电脑看「可加装」，手机没有这回事，改看「续航 / 影像」。
   两者硬套同一套维度会让手机排序完全失真 —— 手机的内存从来都不可换。 */
const DIMS = DATA.dimensions;
const WEIGHTPOOL = DATA.weights;

function kindOf(cat) {
  return (cat && cat.kind) || 'pc';
}
function weightsOf(kind) {
  return WEIGHTPOOL[kind] || WEIGHTPOOL.pc;
}
function dimListOf(kind) {
  return DIMS[kind] || DIMS.pc;
}
/* 品类切换时，如果当前侧重在这个品类里不存在（比如电脑的「能加装」到手机上），
   自动退回该品类的第一个侧重，避免榜单空白。 */
function fixMode(kind, mode) {
  const w = weightsOf(kind);
  return w[mode] ? mode : Object.keys(w)[0];
}

let STATE = { raw: '', cat: null, budget: null, head: '', tone: '', mode: 'value' };

/* ---------- 品类匹配 ---------- */
function analyze(raw) {
  const s = String(raw || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return { err: 'empty' };
  // 苹果以前整条线都不覆盖；现在有了 iPhone 的价格，只挡 Mac
  if (/mac|macbook|imac|苹果电脑|苹果笔记本|mac ?air|mac ?pro/.test(s)) return { err: 'nocover' };

  // 「小米笔记本」「华为笔记本」这类说法里含品牌词，而品牌词又是手机品类的关键词。
  // 先判断说的是不是电脑硬件，避免把「小米笔记本」判成手机。
  const pcWord = /笔记本|电脑|台式|主机|装机|diy|轻薄本|游戏本|显卡|内存|固态/.test(s);
  const phoneWord = /手机|iphone|换机|mate|nova/.test(s);
  const blockPhone = pcWord && !phoneWord;

  let cat = null;
  for (const c of DATA.categories) {
    if (blockPhone && c.key === 'phone') continue;
    if (c.keywords.some(k => s.includes(k.toLowerCase()))) { cat = c; break; }
  }

  // 说了「笔记本」但没说是哪一类（比如「小米笔记本」）—— 按轻薄本处理，
  // 因为这是绝大多数人问「笔记本」时真正指的品类。游戏本有专门关键词，不会被误收。
  if (!cat && pcWord) cat = DATA.categories.find(c => c.key === 'thin') || null;

  // 中文数字先换成阿拉伯数字：五千 → 5000，两万 → 20000
  const cn = { '一': 1, '两': 2, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  const norm = s.replace(/([一两二三四五六七八九])(万|千)/g,
    (all, d, u) => String(cn[d] * (u === '万' ? 10000 : 1000)));

  let budget = null;
  const m = norm.match(/(\d{1,6})(k|千|万)?/);
  if (m) {
    let n = parseInt(m[1], 10);
    if (m[2] === 'k' || m[2] === '千') n *= 1000;
    if (m[2] === '万') n *= 10000;
    if (n >= 1000 && n <= 50000) budget = n;
  }
  if (!cat && !budget) return { err: 'unknown' };
  return { cat, budget };
}

function bandOf(budget, cat) {
  if (!budget) return null;
  const list = (cat && cat.budgetBands) || DATA.budgetBands;
  return list.find(b => budget <= b.max) || list[list.length - 1];
}

/* ---------- 排序引擎 ---------- */
/* 每个维度都归一到 0-100，再做加权平均。价格用「同类最低价 vs 你的预算」双向约束：
   低于预算越多分越高，但超过预算直接掉到很低 —— 这比单纯「越便宜越好」更贴近真实决策。 */
function dims(offer, cat, budget, mode) {
  // cat 这里传的是品类 key（字符串），不是对象 —— 要单独取一次大类
  const catObj = DATA.categories.find(c => c.key === cat);
  const kind = kindOf(catObj);
  const pool = DATA.offers.filter(o => o.cat === cat);
  const prices = pool.map(o => o.price);
  const lo = Math.min.apply(null, prices), hi = Math.max.apply(null, prices);

  // 价格分：池内相对位置（便宜=高分）；给了预算就叠加预算约束
  let p;
  if (budget) {
    const room = budget - offer.price;              // 正数=还有余量
    p = room >= 0 ? Math.min(100, 60 + (room / budget) * 90) : Math.max(0, 60 + (room / budget) * 260);
  } else {
    p = hi === lo ? 70 : 100 - ((offer.price - lo) / (hi - lo)) * 70;
  }

  // 续航 / 影像同理：原始值是绝对值（电池 10080 vs 3692、影像 95 vs 40），
// 而价格分是池内归一的（跨度能到 70 分）。不归一的话，
// 「续航优先」这个权重 0.45 的档位照样会被价格分压过去，选不出续航最好的那台。
  // 排序用归一后的相对分；对外展示一律用原始值（mAh / 主观分），
  // 两边各说各的，绝不在同一个页面上混着给两个口径相同的数字。
  // 注意：norm 必须定义在 perf 之前 —— const 有暂时性死区，用在下文会直接抛 ReferenceError。
  const norm = (key) => {
    const vs = pool.map(o => (typeof o[key] === 'number' ? o[key] : 50));
    const lo2 = Math.min.apply(null, vs), hi2 = Math.max.apply(null, vs);
    const v = (typeof offer[key] === 'number' ? offer[key] : 50);
    return hi2 === lo2 ? 70 : 40 + ((v - lo2) / (hi2 - lo2)) * 60;
  };

  // 性能分。手机用 GB6、电脑用 Cinebench R23 换算，都是「100 ×（0.5×单核/上限 + 0.5×多核/上限）」，
  // 所以同一张分数表里，手机 48 分和电脑 50 分是可比的 —— 都表示「大概是当季旗舰的一半」。
  //
  // 内存/固态这类没有 CPU 的品类，perf 是 null。此时不能塞一个假的池内值，
  // 那等于凭空造数据。改成让 perf 这个维度退出加权（见 score() 的 skip 处理）。
  const perfNA = (o) => o.perf === null || o.perf === undefined;
  let perf;
  if (perfNA(offer)) {
    perf = null;                                    // 本机不适用，score() 会把它从权重里摘掉
  } else if (kind === 'phone') {
    perf = offer.perf;                              // 实测换算分，有绝对含义，直接用
  } else {
    // 电脑：有 R23 实测的也是绝对分。没有实测的（理论上不该存在）才退回池内归一，
    // 这样至少不会让一台没数据的机器在「性能优先」里冒到前面去。
    perf = offer.cb23 ? offer.perf : norm('perf');
  }

  // brandScore 已经直接返回 0-100，这里不再二次换算
  const br = brandScore(offer.brand, kind);
  // 只返回本大类的维度。多返回的键虽然权重用不到，但会让「详情页/图表」有可能
  // 误取到另一类的维度（比如在手机上显示「可加装」），所以在这里就切干净。
  const all = { price: p, perf: perf, brand: br };

  // 电脑：可加装 + 便携
  all.upgrade = offer.upgrade === 2 ? 100 : offer.upgrade === 1 ? 60 : 25;
  all.portable = offer.portable === 3 ? 100 : offer.portable === 2 ? 70 : offer.portable === 1 ? 40 : 10;

  // 手机：续航 / 影像（排序用池内归一，见上面的 norm）
  all.battery = norm('battery');
  all.camera = norm('camera');

  const out = {};
  dimListOf(kind).forEach(d => { out[d.key] = all[d.key]; });
  return out;
}

function brandScore(name, kind) {
  // 同一品牌名可能在两个大类里都出现（华为既有笔记本也有手机），
  // 必须带 scope 一起找，否则会拿到另一类的售后/保值分。
  const k = kind || 'pc';
  const b = DATA.brands.find(x => x.name === name && (x.scope || 'pc') === k);
  if (!b) return 60;
  // 原始分是 (售后 + 保值)/2，落在 2~5 之间。直接乘 10 映射到 0-100 会放大差异：
  // 原始差 1 分就变成 10 分，足以在加权里压过「续航/影像」这种真实差距。
  // 这里压到 60-100 区间：差 1 分约等于 13 分，既不忽略品牌，也不让它喧宾夺主。
  const raw = (b.service + b.resale) / 2;
  return 60 + Math.max(0, Math.min(1, (raw - 2) / 3)) * 40;
}

function score(offer, cat, budget, mode) {
  const d = dims(offer, cat, budget, mode);
  const kind = kindOf(DATA.categories.find(c => c.key === cat));
  const w = weightsOf(kind)[mode].w;
  // 某个维度对这台机器根本不适用时（典型：内存条没有 CPU），dims 会给 null。
  // 这时不能当 0 分算 —— 那等于"因为不涉及所以判它最差"。
  // 正确做法是把它从权重里摘掉，剩下的权重按比例放大回 1。
  let wsum = 0;
  for (const k in w) if (d[k] !== null && d[k] !== undefined) wsum += w[k];
  let total = 0;
  for (const k in w) {
    if (d[k] === null || d[k] === undefined) continue;
    total += d[k] * (w[k] / (wsum || 1));
  }
  return { total: Math.round(total), d, wsum };
}

function rankOffers(cat, budget, mode) {
  const catObj = DATA.categories.find(c => c.key === cat);
  const kind = kindOf(catObj);
  const cfg = weightsOf(kind)[mode] || weightsOf(kind)[Object.keys(weightsOf(kind))[0]];
  const primary = cfg.primary || null;

  // 预算容差：超 5% 以内不算超预算。说「5000 以内」时，5009 那台不该被踢掉 ——
  // 差 9 块钱就换一台机器，不是用户想要的决策方式。
  const slack = budget ? budget * 1.05 : 0;

  // 主维度的原始分要在整池里取范围，才能在档位之间比较。
  // 必须剔除「本维度不适用」的机型（perf=null），否则 Math.min 会把 null 当 0，
  // 档位宽度被拉歪，所有机器挤进同一档。
  const pool = DATA.offers.filter(o => o.cat === cat);
  let ptierOf = () => 0;
  if (primary) {
    const raws = pool
      .filter(o => !(primary === 'perf' && (o.perf === null || o.perf === undefined)))
      .map(o => primaryRaw(o, primary));
    const lo = Math.min.apply(null, raws), hi = Math.max.apply(null, raws);
    // 分三档，档宽 = 池内跨度 / 3。差一档才算「明显不如」——
    // 用连续值做硬门槛会把「差 1 分」也当成断层，那又回到加权的老毛病。
    const width = (hi - lo) / 3 || 1;
    ptierOf = (o) => {
      const raw = primaryRaw(o, primary);
      if (raw === null) return -1;          // 不适用 → 单独一档，排在所有有值的后面
      if (hi === lo) return 0;
      return Math.min(2, Math.floor((raw - lo) / width));  // 0=最弱 2=最强
    };
  }

  return pool
    .map(o => {
      const s = score(o, cat, budget, mode);
      const t = primary ? ptierOf(o) : 0;
      // 榜单上那个大数字 = 排序真正依据的那个数，而且尽量用原始值，不用池内归一值。
      // 理由有两条：
      //   ① 分档排序下加权总分只是第三顺位，拿它当名次分显示会出现
      //      「第 2 名 73 分、第 3 名 74 分」这种自相矛盾的画面。
      //   ② 归一值会把真实差距放大：影像 90 和 88 只差 2 分，归一会变成 95 和 92，
      //      读者以为是两个档次的差距。原始值能和详情页、和参数表对上。
      // 只有 upgrade / portable 是 0-2 / 0-3 的档位，原始值不能当分数看，才退回归一值。
      const disp = primary ? primaryDisplay(o, primary, s.d[primary]) : { v: s.total, unit: '' };
      return Object.assign({}, o, {
        _score: s.total, _d: s.d,
        _main: disp.v, _mainUnit: disp.unit, _mainText: !!disp.text, _mainKey: primary,
        _mainRaw: primary ? primaryRaw(o, primary) : null,
        _over: budget ? o.price > slack : false,
        _ptier: t
      });
    })
    .sort((a, b) => {
      // 超预算的排到后面，但保留在列表里（让人看到差多少钱）
      if (a._over !== b._over) return a._over ? 1 : -1;
      // ① 主维度先分档 —— 点「性能优先」就该先看到性能最强的那一档，
      //    而不是被品牌和续航把差距抵掉。这是加权平均做不到的事：
      //    权重再高也只是「拉票」，票数够了仍然会被别的维度翻盘。
      if (a._ptier !== b._ptier) return b._ptier - a._ptier;
      // ② 同档内按主维度原始分排。不按总分 —— 否则 perf 80 会排在 perf 82 前面，
      //    用户点「性能优先」看到的却不是性能顺序，按钮就成了装饰。
      //    primaryRaw 可能返回 null（该维度不适用），null 一律排在有值之后。
      if (primary) {
        const ra = primaryRaw(a, primary), rb = primaryRaw(b, primary);
        const na = ra === null, nb = rb === null;
        if (na !== nb) return na ? 1 : -1;
        if (!na && rb !== ra) return rb - ra;
      }
      // ③ 主维度打平了才看加权总分
      if (b._score !== a._score) return b._score - a._score;
      // ④ 最后用 id 兜底，保证排序稳定可复现（不能靠引擎稳定性）
      return a.id < b.id ? -1 : 1;
    });
}

/* 榜单大数字该显示什么。原则：能显示原始值就显示原始值，只有档位类维度
   （upgrade / portable）没有「分数」的含义，才回退到池内归一位。 */
function primaryDisplay(o, key, normed) {
  if (key === 'perf' && (o.perf === null || o.perf === undefined)) {
    // 内存条 / 固态没有 CPU。这不是「性能差」，是「这一项不适用」。
    // 显示 0 分会被读成「性能垫底」，显示池内值则是编数据 —— 只能照实说。
    return { v: '不涉及', unit: '', text: true, na: true };
  }
  if (key === 'perf' && o.gb6) return { v: o.perf, unit: '分' };          // 手机：GB6 换算分
  if (key === 'perf' && o.cb23) return { v: o.perf, unit: '分' };         // 电脑：R23 换算分
  if (key === 'perf') return { v: Math.round(normed), unit: '分' };       // 兜底：没实测才用池内位
  if (key === 'battery') return { v: o.battery, unit: 'mAh' };           // 真实容量
  if (key === 'camera') return { v: o.camera, unit: '分' };              // 主观分，原样展示
  // upgrade / portable 是档位，没有「分数」语义。显示 100 / 60 会被当成分数，
  // 而且三台同为「很轻」时会并排三个 100，看不出任何信息 —— 直接给档位原文。
  if (key === 'upgrade') return { v: OUPWORD_RAW[o.upgrade], unit: '', text: true };
  if (key === 'portable') return { v: PORTWORD[o.portable], unit: '', text: true };
  return { v: Math.round(normed), unit: '' };
}

/* 主维度的原始值。upgrade/portable 是 0-3 的档位，先换算成可比数值。 */
function primaryRaw(o, key) {
  if (o[key] === null || o[key] === undefined) return null;   // 不适用
  if (typeof o[key] === 'number') return o[key];
  if (key === 'upgrade') return o.upgrade === 2 ? 2 : o.upgrade === 1 ? 1 : 0;
  if (key === 'portable') return o.portable || 0;
  return 0;
}

/* ---------- 小组件 ---------- */
function barRow(o) {
  const max = o.max || 100;
  const w = Math.min(100, Math.abs(o.value) / max * 100);
  const soft = o.high && o.high > o.value ? Math.min(100, o.high / max * 100) : 0;
  const fill = o.dim ? 'gray' : '';
  return '<div class="row' + (o.dim ? ' dim' : '') + '">' +
    '<div class="top"><span class="lab">' + o.label + '</span><span class="val">' + o.valueText + '</span></div>' +
    '<div class="track">' +
      '<span class="fill ' + fill + '" style="width:' + w + '%"></span>' +
      (soft ? '<span class="fill soft" style="width:' + (soft - w) + '%"></span>' : '') +
    '</div></div>';
}

function srcLine(ids) {
  // 同一家媒体可能有多篇，按媒体去重并取最新日期
  const byPub = {};
  ids.map(id => SRC[id]).filter(Boolean).forEach(s => {
    const cur = byPub[s.publisher];
    if (!cur || s.date > cur.date) byPub[s.publisher] = s;
  });
  const list = Object.keys(byPub).map(k => byPub[k]);
  if (!list.length) return '';
  return '<p class="srcin">依据：' + list.map(s => s.publisher + '（' + s.date + '）').join('、') + '</p>';
}

/* ---------- 四张图 ---------- */
function chartCategory(catKey) {
  const cat = catKey ? DATA.categories.find(c => c.key === catKey) : null;
  const kind = kindOf(cat);
  const rows = DATA.categoryChange.filter(d => d.kind === kind);

  // 只高亮用户所选的那一根；没选品类时全部一视同仁。
  // 早先这里用 keys[i] !== catKey 判断，catKey 为 null 时 null !== null 为 false，
  // 会把「全网均价」误标成用户所选 —— 所以改成按 key 显式比较。
  const html = rows.map(d => barRow({
    label: d.label,
    value: d.value,
    max: kind === 'phone' ? 25 : 60,
    valueText: '+' + d.value + '%',
    dim: catKey ? d.key !== catKey : false
  })).join('');

  const note = kind === 'phone'
    ? '手机的涨幅按机型看不吓人，真正狠的是存储 —— 12GB+256GB 组合的采购价涨了 340%。'
    : '同款机型对比是最有说服力的口径 —— 比"均价"更贴近你真正要付的钱。';

  return '<div class="blk"><h2>你这类机器涨了多少</h2>' +
    '<p class="cap">' + note + '</p>' +
    html +
    '<p class="srcin">数据：新浪财经、Gartner、腾讯新闻（2026）</p></div>';
}

function chartSame(cat) {
  const kind = kindOf(cat);
  const rows = DATA.sameModel.filter(d => d.kind === kind).map(d =>
    '<div class="mrow">' +
    '<div class="mn">' + d.name + '</div>' +
    '<div class="mp">去年 ¥' + fmt(d.before) + ' → 现在 ¥' + fmt(d.after) + '</div>' +
    '<div class="md">+' + d.change + '%</div></div>'
  ).join('');
  return '<div class="blk"><h2>同款机体现在贵多少</h2>' +
    '<p class="cap">从左到右是同一个东西的价格变化，不是不同型号的对比。</p>' +
    rows +
    '<p class="srcin">数据：新浪财经、搜狐、什么值得买、腾讯新闻（2026-10 / 11）</p></div>';
}

function chartParts() {
  const up = DATA.partsChange.filter(d => d.high > 0);
  const down = DATA.partsChange.filter(d => d.high <= 0);
  const rows = up.map(d => barRow({
    label: d.label,
    value: d.low,
    high: d.high,
    max: 520,
    valueText: d.low === d.high ? '+' + d.low + '%' : '+' + d.low + '~' + d.high + '%'
  })).join('');
  const drow = down.map(d =>
    '<div class="downrow"><span>' + d.label + ' <span style="color:var(--ink3)">(' + d.period + ')</span></span>' +
    '<span class="dv">' + signed(d.low) + '</span></div>'
  ).join('');
  return '<div class="blk"><h2>钱被谁赚走了</h2>' +

function rankRow(o, i, budget) {
  const tag = i === 0 && !o._over ? '<span class="badge b-tag">最优解</span>' : '';

    ? '超出预算，仅作对照：这台要 ¥' + fmt(o.price) + '。'
    : '<b>' + o.tag + '</b>' + (o.caution ? '　注意：' + o.caution : '');

  const W = weightsOf(kind)[STATE.mode];

    '<span class="dm"><i class="' + (W.w[d.key] >= .2 ? 'hi' : '') + '" style="width:' + Math.round(o._d[d.key]) + '%"></i></span>'
  ).join('');

    '<span class="num">' + (i + 1) + '</span>' +

    '<span class="sc' + (o._mainText ? ' txt' : '') + '">' + (o._mainText ? o._main : fmt(o._main)) +
      (o._mainUnit ? '<em>' + o._mainUnit + '</em>' : '') + '</span>' +
    '<span class="sp">' + o.spec + '</span>' +
    '<span class="pr">¥' + fmt(o.price) + '</span>' +

  if (!list.length) return '';
  const W = pool[mode];
  const list2 = dimListOf(kind);
  const TOP = 3;

  const head = list.slice(0, TOP).map((o, i) => rankRow(o, i, budget)).join('');
  const rest = list.slice(TOP);

/* ---------- 国补 ---------- */
/* 按实付价算补贴。电脑归家电类（15% / 封顶 1500 / 无门槛），
   手机归数码类（15% / 封顶 500 / 仅 ≤6000 可补）。这两条规则不一样，
   混在一起讲是最容易让人白亏的地方 —— 所以单独开一块，且带计算。 */
function subsidyCalc(rule, price) {
  if (!price || price <= 0) return null;
  const overLine = rule.threshold && price > rule.threshold;
  const raw = price * rule.rate / 100;
  const capped = Math.min(raw, rule.cap);
  const got = overLine ? 0 : Math.round(capped);
  return { raw: Math.round(raw), capped: Math.round(capped), got: got, overLine: !!overLine, pay: price - got };
}

function subsidyBlock() {
  const R = DATA.subsidyRules;
  const card = (key, r) => {
    const sat = Math.round(r.saturate);
    return '<div class="subcard' + (r.threshold ? '' : ' hot') + '">' +
      '<p class="sh">' + (key === 'pc' ? '电脑' : '手机') + '　<span style="font-size:12px;color:var(--ink3)">' + r.bucket + '</span></p>' +
      '<p class="sb">' + (r.threshold ? '≤ ' + fmt(r.threshold) + ' 元才补' : '无价格门槛') + '</p>' +
      '<div class="sr"><span>补贴比例</span><b>' + r.rate + '%</b></div>' +
      '<div class="sr"><span>单件封顶</span><b>¥' + fmt(r.cap) + '</b></div>' +
      '<div class="sr"><span>吃满要实付</span><b>¥' + fmt(sat) + '</b></div>' +
      '<p class="sn">' + r.note + '</p></div>';
  };
  return '<div class="blk"><h2>国补怎么算：电脑和手机不是一套规则</h2>' +
    '<p class="cap">这一块单独讲，因为搞混它的代价是几百到一千五。<b>电脑归家电类，手机归数码类</b> —— ' +
    '两条线的封顶和门槛都不一样，用手机的规则套电脑会白亏。</p>' +
    '<div class="subgrid">' + card('pc', R.pc) + card('phone', R.phone) + '</div>' +
    '<div class="calc">' +
    '<p class="cl">算一下你的到手价</p>' +
    '<div class="calcrow"><input id="pin" type="number" inputmode="numeric" placeholder="输入实付价，比如 5999" min="0"><span class="unit">元</span></div>' +
    '<div class="calcres" id="pout"></div>' +
    '</div>' +
    '<p class="srcin">规则来源：2026 年以旧换新政策（家电 6 类 / 数码 4 类），执行至 2026-12-31。</p></div>';
}

function bindCalc() {
  const inp = $('#pin'), out = $('#pout');
  if (!inp || !out) return;
  const R = DATA.subsidyRules;
  const render = () => {
    const v = parseInt(inp.value, 10);
    if (!v || v <= 0) { out.innerHTML = '<span style="color:var(--ink3)">输入实付价后，这里会分别算出电脑和手机各能补多少。</span>'; return; }
    const pc = subsidyCalc(R.pc, v);
    const ph = subsidyCalc(R.phone, v);
    const line = (name, r) => {
      if (!r) return '';
      const bad = r.overLine;
      return '<div class="ln"><span>' + name + '能补</span><b>' +
        (bad ? '<span style="color:var(--upink)">¥0（超过 ' + fmt(R.phone.threshold) + '，不参与）</span>' : '¥' + fmt(r.got)) +
        '</b></div>';
    };
    let warn = '';
    if (ph.overLine) {
      warn = '<div class="calcwarn bad">这台手机超过 ' + fmt(R.phone.threshold) + ' 元，国补<b>一分不补</b>。' +
        '如果目标是拿补贴，退回到 ' + fmt(R.phone.threshold) + ' 以内往往比硬上更划算。</div>';
    } else if (ph.got === R.phone.cap && v > R.phone.saturate) {
      warn = '<div class="calcwarn tip">手机补贴已经吃满 ¥' + fmt(R.phone.cap) + '，再往上加钱不会多补一分。</div>';
    } else if (!ph.overLine && ph.got < R.phone.cap) {
      warn = '<div class="calcwarn tip">手机再往上加 ¥' + fmt(Math.round(R.phone.saturate - v)) + ' 左右就吃满 ¥' + fmt(R.phone.cap) + '，超过这个点加钱只加配置、不加补贴。</div>';
    } else {
      // 刚好落在吃满点上：这时说「再加钱不涨」是对的，但说「还差多少」就不对了
      const left = R.phone.threshold - v;
      warn = '<div class="calcwarn tip">手机补贴已吃满 ¥' + fmt(R.phone.cap) + '。' +
        '注意离 6000 的红线只剩 ¥' + fmt(left) + ' —— 再加一档配置很可能就跨过去，补贴直接归零。</div>';
    }
    out.innerHTML =
      '<div style="margin-bottom:8px"><span style="color:var(--ink3)">实付 ¥' + fmt(v) + ' 的电脑，省</span> ' +
      '<span class="big save">¥' + fmt(pc.got) + '</span> <span style="color:var(--ink3)">，到手 ¥' + fmt(pc.pay) + '</span></div>' +
      '<div><span style="color:var(--ink3)">同样的价买手机，省</span> ' +
      '<span class="big ' + (ph.overLine ? 'none' : 'save') + '">¥' + fmt(ph.got) + '</span>' +
      ' <span style="color:var(--ink3)">，到手 ¥' + fmt(ph.pay) + '</span></div>' +
      line('电脑', pc) + line('手机', ph) + warn;
  };
  inp.addEventListener('input', render);
  render();
}

function fullResult(cat, budget, raw) {
  const kind = kindOf(cat);
  STATE = { raw, cat, budget, head: cat.headline, tone: cat.tone, mode: fixMode(kind, STATE.mode || 'value') };
  const band = bandOf(budget, cat);
  const isPhone = kind === 'phone';

  let html = '<div class="back" id="back">← 换个问题</div>';
  html += '<div class="vcard fade">' +
    '<span class="pill t-' + cat.tone + '">' + TONE[cat.tone] + '</span>' +
    '<h1 class="vhead">' + cat.headline + '</h1>' +
    '<p class="vsub">' + cat.name + (budget ? ' · 预算 ¥' + fmt(budget) : '') + ' · ' + cat.changeLabel + '</p>' +
    (band ? '<p class="quote">' + band.text + '</p>' : '') +
    '</div>';

  // ① 为什么是这个结论（短，直接展开）
  html += '<div class="blk"><h2>为什么是这个结论</h2><ul class="olist" style="margin-top:14px">' +
    cat.reasons.map(r => '<li>' + r + '</li>').join('') + '</ul></div>';

  // ② 榜单 —— 用户最想要的一句话答案，放最前
  html += rankBlock(cat, budget);

  // ③ 国补 —— 这次单独立块，因为电脑和手机的规则不是一套
  html += subsidyBlock();

  // ④ 品牌。手机没有「可加装」，所以手机不出现在升级指南里
  html += brandBlock(cat);
  if (!isPhone) html += upgradeBlock();

  // ⑤ 电脑专属：设计缺陷。手机这一块用不上，手机的坑在下面
  if (!isPhone) html += defectBlock();

  // ⑥ 品类横向对比（台式 vs 笔记本、6000 门槛这类，决定性信息）
  html += crossSellBlock(cat.key);

  // ⑦ 涨价详情：全部收进折叠区，想看再点
  html += '<div class="foldwrap"><h2>涨了多少：完整数据</h2>' +
    '<p class="cap">这一块是「现在到底贵了多少」的证据，不影响上面的选择，所以默认收起。四张图，不堆更多。</p>';
  html += fold('你这类机器涨了多少', '同款机型对比，比均价更贴近你要付的钱', chartCategory(cat.key) + chartSame(cat));
  html += isPhone
    ? fold('钱被谁赚走了', '存储第一次超过处理器，成了手机里最贵的零件', chartCostShare())
    : fold('钱被谁赚走了', '涨的是存储，不是整台机器', chartParts());
  html += fold('还会不会降', 'DRAM 逐季环比，涨幅在收窄但方向没变', chartQuarter() + chartOutlook());
  html += fold('三个比涨价更贵的坑', isPhone ? '大存储溢价 / 6000 门槛 / 等下轮降价' : '低价条 / 同价减配 / 国补不是常态', trapsBlock(cat));
  html += '</div>';

  // ⑧ 全部品类的横向决策卡
  html += decisionList(cat.key);

  html += '<div class="blk"><h2>现在该怎么做</h2><div class="actcard">' +
    '<p class="al">可以直接照做</p><p>' + cat.action + '</p></div>' + srcLine(cat.sources) + '</div>';

  html += saveBlock();
  return html;
}

/* 手机的费用占比图：存储 vs 处理器 */
function chartCostShare() {
  const C = DATA.costShare;
  if (!C) return '';
  const rows = C.points.map(d => barRow({
    label: d.label,
    value: d.value,
    max: 40,
    valueText: d.value + '%',
    dim: d.label.indexOf('处理器') >= 0
  })).join('');
  return '<div class="blk"><h2>' + C.title + '</h2>' +
    '<p class="cap">这是手机这一轮涨价的根 —— 跟屏幕、跟芯片都没关系。</p>' +
    rows +
    '<div class="actcard" style="margin-top:12px"><p class="al">结论</p><p>' + C.verdict + '</p></div>' +
    srcLine(C.sources) + '</div>';
}

function budgetOnly(budget) {
  STATE = { raw: String(budget), cat: null, budget, head: '先说要买哪一类', tone: 'mixed', mode: STATE.mode || 'value' };
  let html = '<div class="back" id="back">← 换个问题</div>';
  html += '<div class="vcard fade">' +
    '<span class="pill t-mixed">还差一步</span>' +
    '<h1 class="vhead">预算 ¥' + fmt(budget) + '，先定买什么</h1>' +
    '<p class="vsub">不同品类今年的走势差很多，补贴规则也不一样，选一个我再给准数</p>' +
    '</div>';
  html += '<div class="blk cand" id="cand">' +
    DATA.categories.map(c =>
      '<button type="button" data-key="' + c.key + '">' + c.name + '<span style="color:var(--ink3);font-size:13px"> · ' + c.changeLabel + '</span></button>'
    ).join('') + '</div>';
  html += '<div class="blk">' + chartCategory(null) + '</div>';
  html += subsidyBlock();
  html += chartOutlook();
  return html;
}

function unknownCard(raw) {
  STATE = { raw: '', cat: null, budget: null, head: '', tone: '', mode: STATE.mode || 'value' };
  return '<div class="back" id="back">← 换个问题</div>' +
    '<div class="vcard fade">' +
    '<span class="pill t-mixed">没看懂</span>' +
    '<h1 class="vhead">不确定你想问哪一类</h1>' +
    '<p class="vsub">换个说法，或者直接选一个：</p></div>' +
    '<div class="blk cand" id="cand">' +
    DATA.categories.map(c => '<button type="button" data-key="' + c.key + '">' + c.name + '</button>').join('') +
    '</div>';
}

function nocoverCard() {
  STATE = { raw: '', cat: null, budget: null, head: '', tone: '', mode: STATE.mode || 'value' };
  return '<div class="back" id="back">← 换个问题</div>' +
    '<div class="vcard fade">' +
    '<span class="pill t-mixed">信息不足</span>' +
    '<h1 class="vhead">Mac 这条线我暂时没有可靠数据</h1>' +
    '<p class="vsub">这个工具目前覆盖 Windows 整机、DIY 配件和手机。Mac 的调价逻辑和 Windows 阵营不太一样 —— ' +
    '它这一轮基本没跟涨（MacBook Air M5 定价仍是 9499 起），我不想拿别人的数字硬套给你。</p>' +
    '<p class="quote">需要的话，先说清是买电脑还是手机，其余部分我先给你。</p></div>' +
    '<div class="blk cand" id="cand">' +
    DATA.categories.map(c => '<button type="button" data-key="' + c.key + '">' + c.name + '</button>').join('') +
    '</div>';
}

/* 单品详情 */
function detailCard(id) {
  const o = DATA.offers.find(x => x.id === id);
  if (!o) return;
  const cat = DATA.categories.find(c => c.key === o.cat);
  const kind = kindOf(cat);
  const isPhone = kind === 'phone';
  const mode = fixMode(kind, STATE.mode);
  const s = score(o, o.cat, STATE.budget, mode);
  const b = DATA.brands.find(x => x.name === o.brand && (x.scope || 'pc') === kind);
  const bd = STATE.budget;

  // 顶部标签：电脑讲「能不能加」，手机讲「续航和影像的定位」。
  // 阈值改成实测值：电池看 7000mAh（当前这一档的常见分界），影像仍是主观分看 80。
  let badge, badgeTone;
  if (isPhone) {
    badgeTone = o.battery >= 7000 ? 'now' : o.camera >= 80 ? 'think' : 'mixed';
    badge = o.battery >= 7000 ? '续航强项' : o.camera >= 80 ? '影像强项' : '均衡取向';
  } else {
    badgeTone = o.upgrade === 2 ? 'now' : o.upgrade === 1 ? 'mixed' : 'stop';
    badge = '可加装：' + UPWORD[o.upgrade === 2 ? 'good' : o.upgrade === 1 ? 'mixed' : 'bad'];
  }

  // 手机这四项都显示可核实的原始值：容量、GB6 跑分、影像主观分。
  // 池内相对位只在括号里当辅助，因为它是归一值，和原始值不是一个量纲。
  // 主维度那一项已经由「名次依据」交代过（含原始值 + 相对位），这里不再重复。
  // mainKey 要在 subRows 之前算出来，否则下面用不到它（let 有暂时性死区，不是 undefined）。
  const modeCfg = weightsOf(kind)[mode];
  const mainKey = modeCfg.primary;
  const mainDim = mainKey ? dimListOf(kind).find(d => d.key === mainKey) : null;

  const subRows = isPhone
    ? (mainKey === 'battery' ? '' :
        '<dt>续航</dt><dd>' + fmt(o.battery) + ' mAh（池内相对位 ' + Math.round(s.d.battery) + '/100）</dd>') +
      '<dt>芯片</dt><dd>' + (o.chip || '—') +
        (o.gb6 ? '　GB6 单核 ' + fmt(o.gb6[0]) + ' / 多核 ' + fmt(o.gb6[1]) : '') + '</dd>' +
      (mainKey === 'camera' ? '' :
        '<dt>影像</dt><dd>' + o.camera + ' / 100（主观分，池内相对位 ' + Math.round(s.d.camera) + '/100）</dd>')
    : (mainKey === 'upgrade' ? '' :
        '<dt>可加装</dt><dd>' + OUPWORD_RAW[o.upgrade] + '（池内相对位 ' + Math.round(s.d.upgrade) + '/100）</dd>') +
      (mainKey === 'portable' ? '' :
        '<dt>便携</dt><dd>' + PORTWORD[o.portable] + '（池内相对位 ' + Math.round(s.d.portable) + '/100）</dd>');

  // 「名次依据」和「综合分」两行必须和排序逻辑对齐。
  // 关键：同一个指标只给一个口径的数字。之前这里同时印了「性能分 46」和
  // 「GB6 1866」，两个数都叫性能却差一个量级，读者会以为哪里算错了。
  // 现在有主维度时，主维度那一行只给原始值 + 档位 + 池内相对位，不再重复给分。
  const rankRows = mainDim
    ? '<dt>名次依据</dt><dd>' + mainDim.label + '：' +
        (isPhone && mainKey === 'perf' ? o.perf + ' 分'
          : mainKey === 'battery' ? fmt(o.battery) + ' mAh'
          : mainKey === 'camera' ? o.camera + ' 分（主观）'
          : primaryDisplay(o, mainKey, s.d[mainKey]).v) +
        '　·　池内相对位 ' + Math.round(s.d[mainKey]) + '/100' +
        '<br><span class="ddim">先按这一项分三档，同档内再按它从高到低</span></dd>'
    : '<dt>名次依据</dt><dd>综合分 ' + s.total + ' / 100' +
        '<br><span class="ddim">「' + modeCfg.label + '」没有单项硬门槛，按各项加权总分排</span></dd>';

  // 加分项里已经写了主维度，这里就不重复；写重复等于同一个数给两个名字。
  // subRows 已经把续航 / 影像 / 可加装 / 便携讲过了，extraDims 只补真正没出现过的，
  // 否则详情页会出现两条「续航」、两条「价格」，读者会以为数据打架。
  const shown = new Set(isPhone
    ? ['battery', 'camera', 'perf', 'price', 'brand']
    : ['upgrade', 'portable', 'perf', 'price', 'brand']);
  const extraDims = dimListOf(kind).filter(d => !shown.has(d.key) && d.key !== mainKey);
  const extraRows = extraDims.map(d =>
    '<dt>' + d.label + '</dt><dd>' + Math.round(s.d[d.key]) + ' / 100</dd>').join('');

  let html = '<div class="back" id="detailback">← 回榜单</div>';
  html += '<div class="detail fade">' +
    '<span class="pill t-' + badgeTone + '">' + badge + '</span>' +
    '<h1 class="vhead">' + o.name + '</h1>' +
    '<p class="vsub">' + o.spec + ' · ' + cat.name + '</p>' +
    (bd && o.price > bd ? '<p class="quote" style="color:var(--upink)">超出你的预算 ¥' + fmt(o.price - bd) + '。</p>' : '') +
    '<dl class="spec">' +
    '<dt>到手价</dt><dd>¥' + fmt(o.price) + '</dd>' +
    rankRows +
    '<dt>综合分</dt><dd>' + s.total + ' / 100<span class="ddim">（各项加权，仅供参考）</span></dd>' +
    '<dt>价格分</dt><dd>' + Math.round(s.d.price) + ' / 100</dd>' +
    (isPhone && mainKey !== 'perf' ? '<dt>性能</dt><dd>' + o.perf + ' 分' + (mainKey === 'perf' ? '' : '（池内相对位 ' + Math.round(s.d.perf) + '/100）') + '</dd>' : '') +
    subRows +
    ((!isPhone && mainKey !== 'perf')
      ? (o.perf === null || o.perf === undefined
          ? '<dt>性能</dt><dd>不涉及<span class="ddim">（本类目没有 CPU，不计入加权）</span></dd>'
          : '<dt>性能</dt><dd>' + o.perf + ' 分<span class="ddim">（Cinebench R23 '
            + o.cb23[0] + '/' + o.cb23[1] + ' 实测换算）</span></dd>')
      : '') +
    extraRows +
    '<dt>品牌</dt><dd>' + o.brand + (b ? '　' + b.verdict : '') + '</dd>' +
    '</dl>' +
    '<div class="problock"><p class="ph g">优点</p><ul>' + (o.pros || []).map(x => '<li>' + x + '</li>').join('') + '</ul>' +
    '<p class="ph b">缺点</p><ul class="cons">' + (o.cons || []).map(x => '<li>' + x + '</li>').join('') + '</ul></div>' +
    '<div class="actcard"><p class="al">一句话</p><p>' + o.tag + '</p></div>' +
    (o.caution ? '<div class="note" style="background:#fdf4e3;color:#8a5a0b">注意：' + o.caution + '</div>' : '') +
    srcLine(o.sources) +
    '</div>';
  const sec = $('#result');
  sec.innerHTML = html;
  window.scrollTo(0, 0);
  $('#detailback').onclick = () => run(STATE.raw);
}

/* ---------- 保存 ---------- */
function doSave() {
  const btn = $('#savebtn'), note = $('#savenote');
  if (!btn) return;
  const payload = { t: Date.now(), raw: STATE.raw, cat: STATE.cat ? STATE.cat.key : null, budget: STATE.budget, head: STATE.head, tone: STATE.tone };
  let ok = false;
  try { localStorage.setItem(KEY, JSON.stringify(payload)); ok = true; } catch (e) { ok = false; }
  if (ok) {
    btn.textContent = '已保存 · 下次打开还能看到';
    btn.classList.add('done');
    btn.disabled = true;
    note.innerHTML = '';
  } else {
    note.innerHTML = '<div class="note bad">这次结果没保存成功（可能是浏览器隐私模式，或本机存储已满）。' +
      '你可以截图，或复制这句：' + STATE.head + '</div>';
  }
}

function showSaved(s) {
  const el = $('#saved');
  const d = new Date(s.t);
  const when = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  el.innerHTML = '上次看的：<b>' + (s.raw || '—') + '</b> · ' + when + '<br><span style="opacity:.8">' + s.head + '</span>';
  el.hidden = false;
  el.onclick = () => { $('#q').value = s.raw || ''; run(s.raw); };
}

/* ---------- 主流程 ---------- */
function wire() {
  const back = $('#back');
  if (back) back.onclick = goHome;
  const sb = $('#savebtn');
  if (sb) sb.onclick = doSave;

  const cand = $('#cand');
  if (cand) cand.onclick = e => {
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    const c = DATA.categories.find(x => x.key === b.dataset.key);
    const keep = STATE.budget;
    run(keep ? String(keep) + ' ' + c.short : c.name);
    STATE.budget = keep;
  };

  // 侧重切换：只重排榜单，不重建整页（保持滚动位置）
  const weigh = $('#weigh');
  if (weigh) weigh.onclick = e => {
    const b = e.target.closest('.wbtn');
    if (!b || b.dataset.mode === STATE.mode) return;
    STATE.mode = b.dataset.mode;
    const cat = STATE.cat;
    if (!cat) { run(STATE.raw); return; }
    const kind = kindOf(cat);
    const holder = document.createElement('div');
    holder.innerHTML = rankBlock(cat, STATE.budget);
    ['#rank', '#rankrest'].forEach(sel => {
      const old = $(sel), neu = holder.querySelector(sel);
      if (old && neu) old.innerHTML = neu.innerHTML;
    });
    const cap = $('#wcap');
    if (cap) cap.textContent = weightsOf(kind)[STATE.mode].cap + '　·　五根小条：' +
      dimListOf(kind).map(d => d.label).join(' / ');
    Array.prototype.forEach.call(weigh.children, x => x.classList.toggle('on', x.dataset.mode === STATE.mode));
    bindRank();
  };

  bindRank();
  bindCalc();
}

function bindRank() {
  const handler = e => {
    const row = e.target.closest('.rk');
    if (!row) return;
    detailCard(row.dataset.id);
  };
  ['#rank', '#rankrest'].forEach(sel => {
    const el = $(sel);
    if (el) el.onclick = handler;
  });
}

function run(raw) {
  const r = analyze(raw);
  const sec = $('#result');
  if (r.err === 'empty') { $('#q').focus(); return; }
  if (r.cat) STATE.mode = STATE.mode || 'value';

  let html;
  if (r.err === 'unknown') html = unknownCard(raw);
  else if (r.err === 'nocover') html = nocoverCard(raw);
  else if (!r.cat) html = budgetOnly(r.budget);
  else html = fullResult(r.cat, r.budget, raw);

  sec.innerHTML = html;
  $('#home').hidden = true;
  sec.hidden = false;
  window.scrollTo(0, 0);
  wire();
}

function goHome() {
  $('#result').hidden = true;
  $('#home').hidden = false;
  window.scrollTo(0, 0);
  $('#q').focus();
}

/* ---------- 初始化 ---------- */
$('#asof').textContent = DATA.meta.updated;
$('#srccount').textContent = DATA.sources.length;
$('#srclist').innerHTML = DATA.sources.map(s =>
  '<li><b>' + s.title + '</b><br><span class="pm">' + s.publisher + ' · ' + s.date + '</span> · ' +
  '<a href="' + s.url + '" target="_blank" rel="noopener">原文</a></li>'
).join('');

$('#chips').innerHTML = [
  { t: '5000 的轻薄本', v: '5000 的轻薄本' },
  { t: '游戏本', v: '游戏本' },
  { t: '3000 的手机', v: '3000 的手机' },
  { t: '手机 6000 以内', v: '6000 以内的手机' },
  { t: '台式整机', v: '台式整机' },
  { t: '想加内存', v: '想加内存' }
].map(c => '<button class="chip" type="button" data-v="' + c.v + '">' + c.t + '</button>').join('');

$('#chips').onclick = e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  $('#q').value = b.dataset.v;
  run(b.dataset.v);
};
$('#go').onclick = () => run($('#q').value);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') run($('#q').value); });

try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && s.head) showSaved(s);
} catch (e) { /* 隐私模式读不到，静默跳过 */ }
</script>
</body>
</html>

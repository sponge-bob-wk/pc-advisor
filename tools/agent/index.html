<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选机助手 · 说出预算和用途，告诉你买哪台</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     对话页 v2 —— 与向导页完全同风格的卡片式布局
     ════════════════════════════════════════════════════════════════ -->

<!-- 左侧会话栏（结构不变，样式走 style.css 新 token） -->
<button id="sideBtn" class="side-btn" title="对话记录" aria-label="对话记录">☰</button>
<aside class="side" id="side">
  <div class="side-top">
    <button id="newChat" class="new-chat">
      <span class="nc-plus">＋</span><span class="nc-text">新对话</span>
    </button>
  </div>
  <div class="sess-list" id="sessList">
    <div class="sess-empty">还没有对话记录</div>
  </div>
  <div class="side-foot">对话只存在这台电脑上，不上传</div>
</aside>
<div class="side-mask" id="sideMask"></div>

<!-- 刷新面板（结构不变） -->
<div id="rfPanel" class="rf-panel" hidden>
  <div class="rf-h"><b>刷新数据</b><button id="rfClose" class="rf-x" title="关闭">✕</button></div>
  <div class="rf-body">
    <div id="rfChoices"></div>
    <div id="rfProg" class="rf-prog" hidden>
      <div class="rf-bar"><i id="rfBar"></i></div>
      <div id="rfCur" class="rf-cur"></div>
    </div>
    <div id="rfSteps" class="rf-steps"></div>
    <div id="rfCross" class="rf-cross"></div>
  </div>
</div>

<!-- 主区域：向导风格的居中卡片流 -->
<main class="app" id="app">
  <section class="chat">

    <!-- 顶栏：状态 + 刷新（向导风的细条） -->
    <header class="topbar">
      <span class="live"><i class="dot" id="dot"></i><span id="stx">连接中</span><span id="pool" class="pool-pill">库内 — 台</span></span>
      <span class="topbar-right">
        <button id="rfBtn" class="rf" title="重新抓取数据并交叉验证">↻ 刷新</button>
      </span>
    </header>

    <div class="stream" id="stream">
      <div class="hero" id="hero">
        <div class="eyebrow">选机助手 · 对话模式</div>
        <h1>说清楚预算和用途，<br>我告诉你<em>具体买哪一台</em>。</h1>
        <p class="lede">
          直接给机型、到手价，以及这台机器<b>在你这个用途下的短板</b>。
          库里没有的，明说没有。
        </p>

        <div class="acts" id="acts"></div>

        <div class="wizard-entry" onclick="location.href='/wizard.html'">
          <div class="we-emoji">🧭</div>
          <div class="we-main">
            <div class="we-title">向导模式</div>
            <div class="we-desc">不想打字？一步步点选项，引导你说清需求</div>
          </div>
          <div class="we-arrow">→</div>
        </div>
      </div>
    </div>

    <!-- 底部输入区：向导风的圆角卡片 -->
    <div class="dock">
      <div class="chips" id="demoChips"></div>
      <div id="offlineSlot"></div>
      <div class="field">
        <textarea id="inp" rows="1" placeholder="比如：学设计的，预算 5100，要带去教室"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span id="hintRight">只做 Windows 笔记本 / 台式整机 / 内存固态</span>
      </div>
    </div>
  </section>

  <!-- 右侧数据概览（结构不变） -->
  <aside class="rail" id="rail">
    <div class="rail-hd" id="railHd">
      <button id="railBtn" title="收起侧边栏" aria-label="收起侧边栏">›</button>
      <b>数据概览</b>
    </div>
    <div id="railBody">
      <div id="railNow" class="nowbox"></div>
    </div>
    <button id="railTab" title="展开数据概览">数据概览</button>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script src="static/app.js"></script>
<script src="static/sessions.js"></script>
<script src="static/refresh.js"></script>
</body>
</html>

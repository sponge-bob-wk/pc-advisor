<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选机助手 · 说出预算和用途，告诉你买哪台</title>

<!-- ══════════════════════════════════════════════════════════════
     文件组织（手册第 2 节）
     ────────────────────────────────────────────────────────────
     原来 index.html 有 1660 行（CSS 702 + HTML 90 + JS 856），
     全内联。问题：
       · 编辑器卡顿（无语法高亮）
       · 无法格式化（Prettier 对 <style>/<script> 内嵌支持差）
       · git diff 不可读（改一行 CSS，整个文件都变）
       · CSS 有 2 个 :root、68 处硬编码颜色（绕过了设计系统）

     现在拆成三个文件：
       index.html   ← 只有结构（本文件，约 100 行）
       style.css    ← 全部样式（设计系统在 :root）
       app.js       ← 全部逻辑（统一状态对象 S）
       refresh.js   ← 刷新功能（独立 IIFE）

     好处：浏览器可缓存 CSS/JS，编辑器完全支持高亮。
     ══════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark"></span><b>选机助手</b><span class="ver">Demo</span></div>
  <div class="stat">
    <span class="live"><i class="dot" id="dot"></i><span id="stx">连接中</span></span>
    <!-- 🔴 2026-11-26 减法（用户要求）：
         去掉了「数据快照 2026-11-02」。
         这个日期对用户没意义 —— 他关心的是"现在买哪台"，
         不是"你的数据是哪天抓的"。真正需要日期时，
         回答里的价格口径那句已经说了（「这个价是平台标价快照」）。
         元素 id="asof" 删了，app.js 的 set() 有空值保护，不会报错。 -->
    <span class="sep"></span>
    <span id="pool">库内 — 台</span>
    <span class="sep"></span>
    <button id="rfBtn" class="rf" title="重新抓取数据并交叉验证">↻ 刷新数据</button>
    <span id="rfMsg" class="rf-msg"></span>
  </div>
</header>

<!-- 刷新面板：选粒度 → 跑 → 看进度 → 看交叉验证结果 -->
<div id="rfPanel" class="rf-panel" hidden>
  <div class="rf-h"><b>刷新数据</b><button id="rfClose" class="rf-x" title="关闭">✕</button></div>
  <div class="rf-body">
    <div id="rfChoices"></div>
    <div id="rfProg" class="rf-prog" hidden>
      <div class="rf-bar"><i id="rfBar"></i></div>
      <div id="rfCur" class="rf-cur"></div>
    </div>
    <div id="rfSteps" class="rf-steps"></div>
    <div id="rfCross" class="rf-cross"></div>
  </div>
</div>

<main class="app" id="app">
  <section class="chat">
    <div class="stream" id="stream">
      <div class="hero" id="hero">
        <div class="eyebrow">选机助手</div>
        <h1>说清楚预算和用途，<br>我告诉你<em>具体买哪一台</em>。</h1>
        <p class="lede">
          直接给机型、到手价，以及这台机器<b>在你这个用途下的短板</b>。
          库里没有的，明说没有。
        </p>

        <!-- 🔴 2026-11-26 减法：删掉了原来的「四宫格数字」和「审计横幅」。
             原因（用户原话）：「你想表达很多严谨性，但是没必要展示给用户看」
             这四块是给开发/评审看的（可推荐机型 239 / 有跑分实测 162…），
             用户打开首页只想说需求，不想先读一份数据报告。
             数字本身没删 —— 侧边栏「数据概览」里还能看到。 -->

        <div class="acts" id="acts"></div>

        <!-- 🔴 减法：原来这里还有一段 scope 口径长文 +「展开口径说明」按钮。
             价格口径该在**回答里**说（已做成一行小字），不需要在首页先讲一遍
             方法论。删掉。 -->
      </div>
    </div>

    <div class="dock">
      <div class="chips" id="demoChips"></div>
      <div id="offlineSlot"></div>
      <div class="field">
        <textarea id="inp" rows="1" placeholder="比如：学设计的，预算 5100，要带去教室"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span id="hintRight">只做 Windows 笔记本 / 台式整机 / 内存固态</span>
      </div>
    </div>
  </section>

  <aside class="rail" id="rail">
    <div class="rail-hd"><b>数据概览</b><button id="railBtn" title="收起侧边栏">收起 ⟩</button></div>
    <div id="railBody">
      <div id="railNow" class="nowbox"></div>
      <div class="ov">
        <div class="cap">正在读取数据概览…</div>
      </div>
    </div>
  </aside>
</main>

<button id="railTab" title="展开数据概览">数据概览</button>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script src="/static/refresh.js"></script>
</body>
</html>
